<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FAMILY</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>document.documentElement.dataset.theme=(window.Telegram?.WebApp?.initData&&Telegram.WebApp.colorScheme||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark"))==="light"?"light":"dark"</script>
<link rel="stylesheet" href="/fonts/pretendard.css">
<style>
:root,.noir{--bg:#0D0C0A;--surface:#151310;--elev:#1E1B16;--bar:#110F0D;--line:rgba(238,226,198,.09);--line2:rgba(238,226,198,.18);--text:#F3EDE0;--text2:#ABA291;--text3:#8A8272;--gold:#C9A96A;--gold-ink:#D8BD84;--wash:rgba(201,169,106,.1);--edge:rgba(201,169,106,.36);--pos:#93C6A4;--neg:#E3927F;--foil:linear-gradient(180deg,#F5E8C4,#D8BC7E 46%,#B08E4E);--panel:linear-gradient(180deg,rgba(255,240,205,.035),rgba(255,240,205,0) 48%) var(--surface);--sh:inset 0 1px 0 rgba(255,240,205,.05),0 1px 2px rgba(0,0,0,.35);--float:0 20px 40px -20px rgba(0,0,0,.9),0 2px 10px rgba(0,0,0,.5)}
:root{color-scheme:dark;--p2:#BDB7AA;--p3:#B08257;--glow:rgba(201,169,106,.075);--shim:rgba(255,240,205,.07);--obj:0 30px 50px -28px rgba(0,0,0,.95),0 12px 22px -16px rgba(0,0,0,.7);--metal:linear-gradient(135deg,#F3E5BE,#D3B678 30%,#A7864A 64%,#E2CA92);--on-gold:#17120A;--ease:cubic-bezier(.2,.7,.2,1);--g:20px;--sab:max(env(safe-area-inset-bottom,0px),calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)));--sat:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
:root[data-theme=light]{color-scheme:light;--bg:#F2EDE3;--surface:#FBF8F2;--elev:#FFFFFF;--bar:#FBF8F2;--line:rgba(52,40,18,.1);--line2:rgba(52,40,18,.22);--text:#1B1813;--text2:#655D4F;--text3:#776E61;--gold:#A07C36;--gold-ink:#7E5F1E;--wash:rgba(168,132,62,.1);--edge:rgba(168,132,62,.48);--pos:#2B7A52;--neg:#B5483A;--foil:linear-gradient(180deg,#A07B30,#785A1C);--panel:var(--surface);--sh:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(70,52,20,.05),0 12px 24px -20px rgba(70,52,20,.28);--float:0 18px 36px -18px rgba(60,44,14,.38),0 2px 8px rgba(60,44,14,.1);--p2:#8F897D;--p3:#9A6C40;--glow:rgba(255,255,255,.65);--shim:rgba(255,255,255,.75);--obj:0 26px 40px -24px rgba(48,34,8,.62),0 8px 16px -10px rgba(48,34,8,.3)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100vh;color:var(--text);font:500 15px/1.45 Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;z-index:-1;height:380px;background:radial-gradient(90% 100% at 50% 0,var(--glow),transparent 72%);pointer-events:none}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
b,i,em{font-style:normal;font-weight:inherit}
[hidden]{display:none!important}
.defs{position:absolute;width:0;height:0}
.ic{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.foil{padding-right:.04em;background:var(--foil);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
main,#boot{max-width:480px;margin:0 auto;padding:calc(var(--sat) + 14px) var(--g) calc(var(--sab) + 94px)}
.view{display:none}
.view.on{display:block}
.in>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
.in>:nth-child(2){--i:1}.in>:nth-child(3){--i:2}.in>:nth-child(4){--i:3}.in>:nth-child(5){--i:4}.in>:nth-child(n+6){--i:5}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:2px 2px 16px}
h1{font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.03em}
.top p{font-size:13px;color:var(--text2);white-space:nowrap}
.panel{margin-top:12px;padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:var(--sh)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:26px}
h2{font-size:15px;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
h2 small{margin-left:7px;font-size:12.5px;font-weight:500;letter-spacing:0;color:var(--text3)}
.ph>span{font-size:12.5px;color:var(--text2);white-space:nowrap}
.ph>span b{font-weight:600;color:var(--text)}

.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1.6;padding:20px 22px 19px;overflow:hidden;border-radius:22px;color:var(--text);background:radial-gradient(110% 80% at 8% 0,rgba(201,169,106,.17),transparent 58%),linear-gradient(145deg,#27221A,#171511 44%,#0E0D0B);box-shadow:var(--obj)}
.card::before{content:"";position:absolute;inset:0;padding:1px;border-radius:inherit;background:linear-gradient(150deg,rgba(243,226,178,.8),rgba(201,169,106,.14) 36%,rgba(201,169,106,.06) 64%,rgba(226,202,146,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card::after{content:"";position:absolute;inset:-20% auto -20% 0;width:44%;background:linear-gradient(100deg,transparent,rgba(255,244,214,.1) 50%,transparent);transform:translateX(-130%) skewX(-14deg);pointer-events:none}
.in>.card::after{animation:sheen 1.7s .45s var(--ease) both}
@keyframes sheen{to{transform:translateX(360%) skewX(-14deg)}}
.guil{position:absolute;top:4%;left:21%;width:130%;aspect-ratio:1;fill:none;stroke:#C9A96A;stroke-width:.4;opacity:.36;-webkit-mask:radial-gradient(closest-side,#000 20%,transparent 96%);mask:radial-gradient(closest-side,#000 20%,transparent 96%);pointer-events:none}
.card>div{position:relative;display:flex;justify-content:space-between;gap:14px;min-width:0}
.c-top{align-items:center}
.mark{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;font-weight:700;letter-spacing:.3em;white-space:nowrap}
.mark svg{flex:none;width:9px;height:11px;fill:#D3B678}
.mark span{overflow:hidden;text-overflow:ellipsis}
.ava{display:grid;place-items:center;flex:none;width:40px;height:40px;overflow:hidden;border:1.5px solid transparent;border-radius:50%;background:linear-gradient(#1C1914,#1C1914) padding-box,var(--metal) border-box;font-size:15px;font-weight:600;line-height:1;color:#D8BD84}
.ava img{width:100%;height:100%;object-fit:cover}
.eng{font-size:10.5px;font-weight:600;letter-spacing:.2em;color:rgba(243,237,224,.72)}
.card>.c-mid{flex-direction:column;gap:4px}
.bal{margin-left:-.04em;padding-bottom:.04em;overflow:hidden;font-size:44px;line-height:1.1;font-weight:600;letter-spacing:-.035em;white-space:nowrap}
.bal i{margin-left:.2em;font-size:.4em;font-weight:600;letter-spacing:0;color:#D8BD84}
.c-bot{align-items:flex-end}
.who{min-width:0}
.who b,.who span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.who b{font-size:14.5px;font-weight:600;letter-spacing:.01em;text-shadow:0 1px 0 rgba(0,0,0,.7)}
.who span{font-size:12px;color:var(--text2)}
.since{flex:none;text-align:right}
.since .eng{margin-right:-.2em}
.since span{display:block;margin-top:3px;font-size:12.5px;letter-spacing:.06em}

.strip{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;padding:0}
.cell{min-width:0;padding:15px 14px 14px}
button.cell{display:block;width:100%;text-align:left;transition:background-color .2s}
button.cell:active{background-color:var(--wash)}
.lab,.val,.sub{display:block}
.cell+.cell{border-left:1px solid var(--line)}
.lab{overflow:hidden;font-size:12px;color:var(--text2);white-space:nowrap;text-overflow:ellipsis}
.val{margin-top:5px;overflow:hidden;font-size:22px;line-height:1.2;font-weight:600;letter-spacing:-.025em;white-space:nowrap}
.val i{margin-left:.14em;font-size:.57em;font-weight:500;letter-spacing:0;color:var(--text2)}
.sub{margin-top:3px;overflow:hidden;font-size:11.5px;color:var(--text3);white-space:nowrap;text-overflow:ellipsis}
.sub.go{font-weight:600;color:var(--gold-ink)}

.chip{display:inline-flex;align-items:center;align-self:center;gap:4px;height:26px;padding:0 10px 0 7px;border-radius:13px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--edge);font-size:12px;font-weight:600;color:var(--gold-ink)}
.chip .ic{width:14px;height:14px;stroke-width:2}
.chip.off{padding:0 10px;background:none;box-shadow:inset 0 0 0 1px var(--line2);color:var(--text2)}
.streak{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:8px}
.streak .val{margin:0;font-size:26px}
.streak span{font-size:12.5px;color:var(--text2);white-space:nowrap}
.streak span b{font-weight:600;color:var(--text)}
.ruler{display:flex;align-items:flex-end;height:22px;margin:18px 0 26px}
.ruler i{position:relative;display:flex;flex:1;align-items:flex-end;justify-content:center;height:100%}
.ruler i::before{content:"";width:3px;height:3px;border-radius:2px;background:var(--line2)}
.ruler .n::before{height:8px}
.ruler .y::before{height:100%;background:linear-gradient(var(--gold-ink),var(--gold))}
.ruler .t::before{height:100%;background:none;box-shadow:inset 0 0 0 1px var(--text2)}
.ruler .wk{margin-left:5px}
.ruler span{position:absolute;top:calc(100% + 9px);left:50%;font-size:10.5px;line-height:1.3;color:var(--text3);transform:translateX(-50%)}
.ruler .now::after{content:"";position:absolute;top:calc(100% + 3px);width:3px;height:3px;border-radius:50%;background:var(--gold)}
.ruler .now span{font-weight:600;color:var(--text)}
.hint{margin-top:16px;padding-top:13px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text2)}
.hint b{font-weight:600;color:var(--text)}

.chart{position:relative;margin-top:14px;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.gl{stroke:var(--line)}
.gl.b{stroke:var(--line2)}
.avl{stroke:var(--text3);stroke-dasharray:2 3}
.key{display:inline-block;width:12px;margin-right:6px;border-top:1.5px dashed var(--text3);vertical-align:middle}
.tk{font-size:10.5px;fill:var(--text3)}
.pk{font-size:10.5px;font-weight:600;fill:var(--text2);stroke:var(--surface);stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
.nil{font-size:12px;fill:var(--text3)}
.bars path{fill:url(#gBar);transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s var(--ease) both;animation-delay:calc(var(--d)*16ms)}
.bars.dn path{fill:var(--text3);transform-origin:50% 0}
@keyframes grow{from{transform:scaleY(0)}}
.xh{stroke:var(--line2);opacity:0}
.scrub .xh{opacity:1}
.scrub .pk{opacity:0}
.scrub .bars path{opacity:.34}
.scrub .bars path.on{opacity:1}
.tip{position:absolute;top:-10px;left:0;display:flex;align-items:baseline;gap:6px;padding:5px 9px;border-radius:9px;background:var(--elev);box-shadow:inset 0 0 0 1px var(--line2),var(--float);font-size:11.5px;color:var(--text2);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.tip b{font-size:12.5px;font-weight:600;color:var(--text)}
.scrub .tip{opacity:1}
.lg{display:flex;gap:16px;margin-top:10px;font-size:12.5px;color:var(--text2)}
.lg i{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:2px;background:var(--gold)}
.lg span+span i{background:var(--text3)}
.lg b{margin-left:5px;font-weight:600;color:var(--text)}

.list{padding:16px 18px 6px}
.grp{padding:14px 0 2px;font-size:12px;font-weight:600;color:var(--text3)}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 0}
.row+.row{background:linear-gradient(var(--line),var(--line)) 46px 0/100% 1px no-repeat}
.ico,.av{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:var(--elev);box-shadow:inset 0 0 0 1px var(--line2);font-size:13.5px;font-weight:600;line-height:1;color:var(--text2)}
.ico .ic{width:18px;height:18px}
.rm{flex:1;min-width:0}
.rm b,.rm span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rm b{font-size:14.5px;font-weight:600}
.rm span{font-size:12px;color:var(--text3)}
.row em{flex:none;font-size:15px;font-weight:600;letter-spacing:-.01em}
.ra{flex:none;max-width:60%;text-align:right}
.ra em,.ra span{display:block;white-space:nowrap}
.ra span{font-size:12px;color:var(--text3)}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.gold{color:var(--gold-ink)}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 0 30px;color:var(--text3);text-align:center}
.empty>.ic{width:26px;height:26px;margin-bottom:8px;stroke-width:1.25}
.empty p{font-size:14px;font-weight:600;color:var(--text2)}
.empty span{font-size:12.5px}
.empty .ghost{margin-top:14px}
.ghost{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--edge);font-size:14.5px;font-weight:600;color:var(--gold-ink)}
.ghost .ic{width:18px;height:18px}

.kpi{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row;margin-top:0}
.kpi .cell{padding:16px 18px 15px}
.kpi .cell:nth-child(odd){border-left:0}
.kpi .cell:nth-child(n+3){border-top:1px solid var(--line)}
.kpi .val{font-size:24px}

.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border:1px solid var(--line);border-radius:15px;background:var(--surface)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:11px;background:var(--elev);box-shadow:inset 0 0 0 1px var(--edge),0 2px 6px -2px rgba(0,0,0,.4);transform:translateX(calc(var(--k,0)*100%));transition:transform .4s var(--ease)}
.seg button{position:relative;height:40px;font-size:13.5px;font-weight:600;color:var(--text2)}
.seg button::after{content:"";position:absolute;inset:-5px 0}
.seg .on{color:var(--text)}
.podium{display:grid;grid-template-columns:1fr 1.16fr 1fr;align-items:end;gap:10px;margin-top:22px;padding:0 6px}
.pod{display:flex;flex-direction:column;align-items:center;min-width:0}
.pod>.ic{margin-bottom:6px;color:var(--gold-ink)}
.pod .av{position:relative;width:52px;height:52px;box-shadow:inset 0 0 0 1.5px var(--p2);font-size:19px;color:var(--text)}
.p3 .av{box-shadow:inset 0 0 0 1.5px var(--p3)}
.p1 .av{width:68px;height:68px;border:2px solid transparent;background:linear-gradient(var(--elev),var(--elev)) padding-box,var(--metal) border-box;box-shadow:0 12px 24px -12px rgba(201,169,106,.5);font-size:25px}
.pod .av:empty{border:0;background:none;box-shadow:inset 0 0 0 1px var(--line2)}
.pod .av:empty+b{color:var(--text3)}
.podium:last-child{border-bottom:1px solid var(--line2)}
.pod.me .av::after{content:"나";position:absolute;right:-4px;bottom:-2px;height:18px;padding:0 6px;border-radius:9px;background:var(--metal);box-shadow:0 0 0 2px var(--bg);font-size:10.5px;font-weight:700;line-height:18px;color:var(--on-gold)}
.pod>b{max-width:100%;margin-top:10px;overflow:hidden;font-size:13.5px;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.pod>span:last-of-type{font-size:12.5px;color:var(--text2)}
.pl{display:grid;place-items:center;width:100%;height:44px;margin-top:12px;border-radius:14px 14px 0 0;background:linear-gradient(var(--elev),var(--surface));box-shadow:inset 0 1px 0 var(--line2),inset 1px 0 0 var(--line),inset -1px 0 0 var(--line);font-size:22px;font-weight:700;color:var(--p3);transform-origin:50% 100%}
.p2 .pl{height:64px;color:var(--p2)}
.p1 .pl{height:90px;background:radial-gradient(130% 70% at 50% 0,var(--wash),transparent 72%),linear-gradient(var(--elev),var(--surface));box-shadow:inset 0 1.5px 0 var(--edge),inset 1px 0 0 var(--line),inset -1px 0 0 var(--line);font-size:30px;color:var(--gold-ink)}
.in .pl{animation:plinth .8s .1s var(--ease) both}
@keyframes plinth{from{opacity:0;transform:scaleY(.3)}}
.rows{margin-top:0;padding:6px 18px;border-radius:6px 6px 20px 20px}
.rows .row{gap:10px;min-height:54px}
.rows .row+.row{background-position:42px 0}
.rk{flex:none;min-width:22px;font-size:13.5px;font-weight:600;color:var(--text3);text-align:center}
.rows .av,.pin .av{width:32px;height:32px;font-size:13px}
.nm{display:flex;flex:1;align-items:center;gap:6px;min-width:0}
.nm b{min-width:0;overflow:hidden;font-size:14.5px;white-space:nowrap;text-overflow:ellipsis}
.tag{flex:none;height:18px;padding:0 6px;border-radius:9px;background:var(--metal);font-size:10.5px;font-weight:700;line-height:18px;color:var(--on-gold)}
.row.me{margin:0 -18px;padding:9px 18px;background-color:var(--wash);background-image:none;box-shadow:inset 2px 0 0 var(--gold)}
.row.me b{font-weight:600}
.row.me em{color:var(--gold-ink)}
.pin{position:fixed;right:0;bottom:calc(var(--sab) + 59px);left:0;z-index:21;padding:28px var(--g) 12px;background:linear-gradient(transparent,var(--bg) 60%);pointer-events:none}
.pin .row.me{max-width:440px;margin:0 auto;padding:0 18px;border-radius:18px;background:var(--elev);box-shadow:inset 0 0 0 1px var(--edge),var(--float)}
.pinned{padding-bottom:76px}

.wheel-box{position:relative;width:max(220px,min(100%,340px,calc(var(--tg-viewport-stable-height,100vh) - 300px)));aspect-ratio:1;margin:2px auto 0}
.wheel-box::before{content:"";position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(closest-side,rgba(201,169,106,.16) 82%,transparent)}
[data-theme=light] .wheel-box::before{inset:8% 2% -6%;background:radial-gradient(closest-side,rgba(48,34,8,.34),transparent)}
.wheel{position:absolute;inset:0;overflow:hidden}
.wheel>*{position:absolute;inset:0;width:100%;height:100%}
.bezel{border-radius:50%;background:conic-gradient(from -50deg,#F6EAC8,#CDAE6E 9%,#8C6E3A 22%,#E6D19C 36%,#B4935A 48%,#7C6032 60%,#EBDAAC 74%,#A68646 88%,#F6EAC8);-webkit-mask:radial-gradient(closest-side,transparent 93.8%,#000 94.2%);mask:radial-gradient(closest-side,transparent 93.8%,#000 94.2%)}
.w0{fill:#221C14}.w1{fill:#14110E}.w2{fill:#2C2419}
.w-top{fill:url(#gTop)}.w-tint{fill:url(#gTint)}
.w-sep{stroke:#8F7240;stroke-width:.8;opacity:.75}
.w-ring{fill:none;stroke:#8F7240}
.w-peg{fill:#DCC48E;stroke:#17120A;stroke-width:.6}
.w-lab{font-weight:600;letter-spacing:-.01em;fill:#F0E9D9}
.t-nil{font-weight:500;fill:#958D7D}
.t-top{font-weight:700;fill:#1A1408}
.t-tint{fill:#EAD9AA}
.hit{fill:rgba(246,234,200,.14);stroke:#F6EAC8;stroke-width:1.5;stroke-linejoin:round;opacity:0}
.hit.on{animation:hit 1.5s ease-out both}
#disc [data-i]{transition:opacity .6s}
#disc.done [data-i]:not(.win){opacity:.36}
@keyframes hit{0%{opacity:0}18%{opacity:1}36%{opacity:.3}58%{opacity:1}to{opacity:.85}}
.ro{display:flex;flex-direction:column;align-items:center;min-height:84px;margin-top:16px;text-align:center}
.ro-l{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--text2)}
.ro-v{max-width:100%;overflow:hidden;font-size:32px;line-height:1.2;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.ro-v i{margin-left:.14em;font-size:.5em;font-weight:600;letter-spacing:0;color:var(--text2)}
.ro-v .foil+i{color:var(--gold-ink)}
.ro-s{margin-top:1px;font-size:12.5px;color:var(--text2)}

(() => {

const tg = window.Telegram?.WebApp, D = document, R = D.documentElement;
const $ = (s, p = D) => p.querySelector(s), $$ = (s, p = D) => [...p.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const fmt = (n) => Number(n || 0).toLocaleString("ko-KR");

  check: "M5.5 12.5l4.2 4.2 8.8-9.2",
  list: "M9 7h10M9 12h10M9 17h10M5 7h.01M5 12h.01M5 17h.01",
  lock: "M8 10.5V8a4 4 0 0 1 8 0v2.5M6.5 10.5h11A1.5 1.5 0 0 1 19 12v6.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 18.5V12a1.5 1.5 0 0 1 1.5-1.5ZM12 14.3v2.4",

};
const icon = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
const empty = (ic, a, b = "") => `<div class="empty">${ic ? icon(ic) : ""}<p>${a}</p><span>${b}</span></div>`;
const cell = ([l, v, un, s, go]) => `<${go ? `button type="button" data-go="${go}"` : "div"} class="cell"><span class="lab">${l}</span><span class="val"><b>${v}</b><i>${un}</i></span><span class="sub${go === "roulette" ? " go" : ""}">${s}</span></${go ? "button" : "div"}>`;
const big = (v) => (v >= 1e6 ? kfmt(v) : fmt(v));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const bar = (i, x, y0, h, w, s = -1) => { const r = Math.min(3, w / 2, h); return `<path style="--d:${i}" data-i="${i}" d="M${f1(x - w / 2)} ${y0}V${f1(y0 + s * (h - r))}q0 ${s * r} ${r} ${s * r}h${f1(w - 2 * r)}q${r} 0 ${r} ${-s * r}V${y0}Z"/>`; };
const SK = (...h) => h.map((x) => `<div class="sk" style="height:${x}px"></div>`).join("");

let me, tab, stats, period, seen = 0, busy = false, rot = 0, wedge, width = innerWidth;
const ranks = {}, once = {};

function theme() {
  const t = (tg?.initData && tg.colorScheme || (matchMedia("(prefers-color-scheme:light)").matches ? "light" : "dark")) === "light" ? "light" : "dark";
  R.dataset.theme = t;
  ["setHeaderColor", "setBackgroundColor", "setBottomBarColor"].forEach((f, i) => { try { tg?.[f]?.(CHROME[t][i >> 1]); } catch {} });
}

async function api(path, method = "GET") {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 12000);
  let res;
  try { res = await fetch(path, { method, headers: { "X-Init-Data": tg?.initData || "" }, signal: c.signal }); }
  catch { throw Object.assign(new Error("네트워크 상태를 확인한 뒤 다시 시도해 주세요."), { status: 0 }); }
  finally { clearTimeout(t); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(typeof body.detail === "string" ? body.detail : "요청을 처리하지 못했습니다."), { status: res.status });
  return body;
}

function enter(el) { el.classList.remove("in"); void el.offsetWidth; el.classList.add("in"); }

function fit(el) {
  el.style.fontSize = "";
  const w = el.clientWidth, s = el.scrollWidth;
  if (s > w) el.style.fontSize = Math.floor(parseFloat(getComputedStyle(el).fontSize) * w / s * 10) / 10 - .3 + "px";
}

function even(els) {
  if (!els.length || !els[0].offsetParent) return;
  els.forEach(fit);
  const m = Math.min(...els.map((e) => parseFloat(getComputedStyle(e).fontSize)));
  els.forEach((e) => (e.style.fontSize = m + "px"));
}

function refit() {
  $$(".bal,.ro-v,#h-att .val").forEach((el) => el.offsetParent && fit(el));
  even($$("#h-strip .val")); even($$("#s-body .kpi .val"));
}

function count(el, to, from = 0, ms = 900) {
  const id = el._n = (el._n || 0) + 1, t0 = performance.now();
  el.textContent = fmt(still ? to : from);
  if (still || from === to) return;
  const step = (t) => {
    if (el._n !== id) return;
    const p = Math.min(1, (t - t0) / ms);
    el.textContent = fmt(Math.round(from + (to - from) * (1 - (1 - p) ** 4)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function nice(m) {
  if (m <= 4) return m <= 0 ? 0 : m <= 2 ? 2 : 4;
  const q = m / 4, p = 10 ** Math.floor(Math.log10(q));
  return [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((c) => c * p >= q) * p * 4;
}

function scrub(el, n, pw, pick) {
  const svg = $("svg", el);
  let t;
  const at = (e) => {
    const x = (e.touches ? e.touches[0] : e).clientX - svg.getBoundingClientRect().left;
    clearTimeout(t); el.classList.add("scrub"); pick(clamp(Math.floor(x / pw * n), 0, n - 1));
  };
  const end = () => { t = setTimeout(() => el.classList.remove("scrub"), 1200); };
  ["touchstart", "touchmove", "mousemove"].forEach((k) => svg.addEventListener(k, at, { passive: true }));
  ["touchend", "touchcancel", "mouseleave"].forEach((k) => svg.addEventListener(k, end));
}

function chart(el, o) {
  const v = o.v, n = v.length, W = el.clientWidth, H = o.h, pt = 22, pb = 20, pw = W - 30, ph = H - pt - pb, y0 = pt + ph;
  const max = Math.max(0, ...v), top = nice(max), sw = pw / (n || 1);
  const X = (i) => f1((i + .5) * sw), Y = (x) => f1(y0 - (top ? x / top * ph : 0));
  let s = `<line class="gl b" x2="${pw}" y1="${y0}" y2="${y0}"/>`;
  if (max) {
    const pk = v.indexOf(max);
    [1, .5].forEach((k) => { const y = Y(top * k); s += `<line class="gl" x2="${pw}" y1="${y}" y2="${y}"/><text class="tk" x="${W}" y="${y + 3.5}" text-anchor="end">${kfmt(top * k)}</text>`; });
    if (o.avg !== false) { const ya = Y(v.reduce((a, b) => a + b, 0) / n); s += `<line class="avl" x2="${pw}" y1="${ya}" y2="${ya}"/>`; }
    s += `<g class="bars">${v.map((x, i) => (x ? bar(i, X(i), y0, Math.max(2, x / top * ph), Math.min(o.bw, Math.max(2, sw - 3))) : "")).join("")}</g>`;
    s += `<text class="pk" x="${clamp(X(pk), 16, pw - 16)}" y="${Y(max) - 7}" text-anchor="middle">${o.peak(pk)}</text>`;
  } else s += `<text class="nil" x="${pw / 2}" y="${pt + ph / 2 + 4}" text-anchor="middle">기록 없음</text>`;
  o.ticks.forEach(([i, t]) => { s += `<text class="tk" x="${!i ? 0 : i === n - 1 ? pw : X(i)}" y="${H - 3}" text-anchor="${!i ? "start" : i === n - 1 ? "end" : "middle"}">${t}</text>`; });
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.name}">${s}<line class="xh" y1="${pt - 4}" y2="${y0}"/></svg><div class="tip"><span></span><b></b></div>`;
  if (!n) return;
  const xh = $(".xh", el), tip = $(".tip", el), bars = $$(".bars path", el);
  scrub(el, n, pw, (i) => {
    bars.forEach((b) => b.classList.toggle("on", +b.dataset.i === i));
    xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i));
    [tip.firstChild.textContent, tip.lastChild.textContent] = o.tip(i);
    tip.style.transform = `translateX(${clamp(X(i) - tip.offsetWidth / 2, 0, W - tip.offsetWidth)}px)`;
  });
}

function flow(el, d) {
  const n = d.length, W = el.clientWidth, H = 78, mid = 31, sw = W / (n || 1), bw = Math.min(5, Math.max(2, sw - 3)), X = (i) => f1((i + .5) * sw);
  const u = 25 / Math.max(1, ...d.map((x) => Math.max(x.joins, x.leaves)));
  const bars = (k, s) => d.map((x, i) => (x[k] ? bar(i, X(i), mid + s * 1.5, x[k] * u, bw, s) : "")).join("");
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="입장 · 퇴장"><line class="gl b" x2="${W}" y1="${mid}" y2="${mid}"/><g class="bars">${bars("joins", -1)}</g><g class="bars dn">${bars("leaves", 1)}</g>`
    + (n ? `<text class="tk" y="${H - 3}">${md(d[0].day)}</text><text class="tk" x="${W}" y="${H - 3}" text-anchor="end">오늘</text>` : "")
    + `<line class="xh" y1="2" y2="${H - 20}"/></svg><div class="tip"><span></span><b></b></div>`;
  if (!n) return;
  const xh = $(".xh", el), tip = $(".tip", el), marks = $$(".bars path", el);

  });
}

  }

const hasWheel = () => me.roulette.enabled && me.roulette.slots.length > 1;
const best = () => { const s = me.roulette.slots.filter(Boolean); return new Set(s).size > 1 ? Math.max(...s) : Infinity; };

function buildWheel() {
  const s = me.roulette.slots, n = s.length, th = 360 / n, top = best(), solid = n > 3;
  const pt = (d, r) => { const a = d * Math.PI / 180; return `${+(Math.sin(a) * r).toFixed(2)} ${+(-Math.cos(a) * r).toFixed(2)}`; };
  const em = (t) => [...t].reduce((a, c) => a + (c >= "0" && c <= "9" ? .6 : c === "," || c === "." ? .26 : 1), 0);
  const fs = [28, 28, 28, 26, 22, 20, 18.5, 17.5, 16.5, 15.5, 14.5, 14, 13.5][n] || 13, across = 2 * (solid ? 98 : 80) * Math.sin(Math.PI / n) * .74;
  const radial = n >= 9 || Math.max(...s.map((v) => em(prize(v)))) * fs > across * 1.4, rl = radial ? 90 : solid ? 98 : 80, room = radial ? 84 : across;
  wedge = (i) => `M0 0L${pt(i * th, 137)}A137 137 0 0 1 ${pt((i + 1) * th, 137)}Z`;
  let seg = "", sep = "", peg = "", lab = "";
  s.forEach((v, i) => {
    const hi = v === top, text = prize(v);
    seg += `<path data-i="${i}" class="${hi ? (solid ? "w-top" : "w-tint") : "w" + (n % 2 && i === n - 1 ? 2 : i % 2)}" d="${wedge(i)}"/>`;
    sep += `<path d="M${pt(i * th, 34)}L${pt(i * th, 137)}"/>`;
    peg += `<circle r="2.3" transform="rotate(${i * th}) translate(0 -129)"/>`;
    lab += `<text data-i="${i}" transform="rotate(${(i + .5) * th}) translate(0 ${-rl})${radial ? " rotate(-90)" : ""}" dy=".36em" font-size="${f1(Math.min(fs, room / em(text)))}"${hi ? ` class="${solid ? "t-top" : "t-tint"}"` : v ? "" : ` class="t-nil"`}>${text}</text>`;
  });
  const box = `viewBox="-160 -160 320 320" aria-hidden="true"`;
  rot = 360 - (s.indexOf(Math.max(...s)) + .5) * th;
  $("#wheel").innerHTML = `<div class="bezel"></div>`
    + `<svg ${box}><circle r="144.2" fill="none" stroke="#090807" stroke-width="12.6"/><circle r="144.2" fill="none" stroke="#8F7240" stroke-width="4" stroke-dasharray=".9 14.2" opacity=".8"/><circle r="150.5" fill="none" stroke="#000" stroke-opacity=".6"/></svg>`
    + `<svg ${box} id="disc" style="transform:rotate(${rot}deg)"><circle r="138" fill="#0A0908"/>${seg}<g class="w-sep">${sep}</g><circle class="w-ring" r="137"/><g class="w-peg">${peg}</g><g class="w-lab" text-anchor="middle">${lab}</g><path class="hit" id="hit"/><circle r="35" fill="#0C0B09"/><circle class="w-ring" r="35"/></svg>`
    + `<svg ${box}><circle r="137.5" fill="url(#gSheen)"/><circle r="29" cy="3" fill="#000" opacity=".5"/><circle r="26" fill="url(#gHub)" stroke="url(#gGold)" stroke-width="2.5"/><path d="M0-9 6.6 0 0 9-6.6 0Z" fill="url(#gGold)"/>`
    + `<g id="needle"><path d="M0-123 10-157H-10Z" opacity=".45"/><path d="M0-126-9.5-158H0Z" fill="#F6EAC8"/><path d="M0-126 9.5-158H0Z" fill="#B28E50"/><path d="M0-126 9.5-158H-9.5Z" fill="none" stroke="#17120A" stroke-width=".75" stroke-linejoin="round"/></g></svg>`;
}

function readout(s, pts) {
  const u = me.user, el = $("#ro"), have = `보유 ${fmt(u.points)} P · 이용권 ${fmt(u.tickets)}장`, won = `<b class="foil">+<span>0</span></b><i>P</i>`, left = `<b>${fmt(u.tickets)}</b><i>장</i>`;
  const [a, b, c] = { idle: ["이용권", left, u.tickets ? `보유 ${fmt(u.points)} P` : "이용권은 관리자가 지급합니다"], spin: ["이용권", left, `보유 ${fmt(u.points)} P`], lose: ["결과", "<b>꽝</b>", have], win: ["당첨", won, have], top: ["최고 당첨", won, have] }[s];
  const fresh = el.dataset.s !== s;
  el.dataset.s = s;
  el.innerHTML = `<p class="ro-l">${a}</p><p class="ro-v">${b}</p><p class="ro-s">${c}</p>`;
  if (pts) count($("span", el), pts, 0, 800);
  fit($(".ro-v", el));
  if (fresh) enter(el);
}

  }).join("") : empty("roulette", "당첨 기록 없음"));

function motor() {
  const disc = $("#disc"), nd = $("#needle"), th = 360 / me.roulette.slots.length;
  let v = 0, last = performance.now(), plan, done;
  const end = new Promise((r) => (done = r));
  const paint = () => {
    const p = (((rot % th) + th) % th) / th;
    disc.style.transform = `rotate(${rot}deg)`;
    nd.setAttribute("transform", `rotate(${f1(-15 * Math.min(1, v / 220) * Math.exp(-p * 6))} 0 -157)`);
  };
  const frame = (t) => {
    const dt = Math.min(.05, (t - last) / 1e3);
    last = t;
    if (plan) {
      const q = 1 - Math.min(1, (t - plan.t) / plan.T);
      rot = plan.a + plan.S * (1 - q * q * q); v = 3000 * plan.S * q * q / plan.T;
      if (!q) { rot %= 360; v = 0; paint(); return done(); }
    } else { v = Math.min(620, v + 1400 * dt); rot += v * dt; }
    paint();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  const brake = (S) => { plan = { a: rot, S, T: 3000 * S / Math.max(v, 1), t: performance.now() }; return end; };
  return { land: (to) => brake((((to - rot) % 360) + 360) % 360 + 720), stop: () => brake(Math.max(v, 1) * .3) };
}

function celebrate(big) {
  if (still) return;
  const fx = $("#fx"), b = $("#wheel").getBoundingClientRect(), R = b.width / 2, cx = b.left + R, cy = b.top + R, view = $("#v-roulette");
  view.classList.add("party"); clearTimeout(view._p); view._p = setTimeout(() => view.classList.remove("party"), 3800);
  const add = (tag, css, frames, opt) => { const e = D.createElement(tag); e.style.cssText = css; fx.append(e); e.animate(frames, { fill: "both", ...opt }).onfinish = () => e.remove(); };
  for (let k = 0; k < (big ? 3 : 1); k++) add("b", `left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px`, [{ transform: "scale(.95)", opacity: .9 }, { transform: "scale(1.13)", opacity: 0 }], { duration: 1200, delay: k * 340, easing: "cubic-bezier(.2,.7,.2,1)" });
  for (let k = 0; big && k < 48; k++) {
    const a = Math.random() * 3.84 - 3.5, c = Math.cos(a), s = Math.sin(a), d = R * (.1 + Math.random() * .34), z = .5 + Math.random(), r = Math.random() * 540 - 270;
    add("i", `left:${cx + c * R * .97}px;top:${cy + s * R * .97}px`, [{ transform: "scale(0)", opacity: 0, easing: "cubic-bezier(.1,.7,.3,1)" }, { transform: `translate(${c * d}px,${s * d}px) scale(${z}) rotate(${r}deg)`, opacity: 1, offset: .5, easing: "cubic-bezier(.5,0,.9,.6)" }, { transform: `translate(${c * d * 1.15}px,${s * d + R * .4}px) scale(${z * .7}) rotate(${r * 1.7}deg)`, opacity: 0 }], { duration: 2400 + Math.random() * 1000, delay: Math.random() * 150 });
  }
}

function rest() {
  $("#hit").classList.remove("on");
  $("#disc").classList.remove("done");
  $$("#disc .win").forEach((e) => e.classList.remove("win"));
}

async function spin() {
  const u = me.user, hit = $("#hit"), disc = $("#disc");
  if (busy || !u.tickets) return;
  busy = true; R.dataset.spinning = "1";
  cta(); readout("spin"); rest(); haptic("impactOccurred", "medium");
  const m = still ? null : motor();
  let r;
  try { [r] = await Promise.all([api("/api/spin", "POST"), wait(still ? 0 : 700)]); }
  catch (e) {
    if (m) await m.stop();
    busy = false; delete R.dataset.spinning;
    if (e.status === 409) u.tickets = 0;
    cta(); readout("idle"); $(".ro-s").textContent = e.message; haptic("notificationOccurred", "error");
    return;
  }
  u.tickets = r.tickets; readout("spin");
  const to = 360 - (r.index + .5 + (Math.random() - .5) * .56) * 360 / me.roulette.slots.length;
  if (m) await m.land(to); else { rot = ((to % 360) + 360) % 360; disc.style.transform = `rotate(${rot}deg)`; }
  const kind = !r.points ? "lose" : r.points >= best() ? "top" : "win";
  u.points = r.balance;
  if (r.points) me.roulette.recent = [{ name: u.name, points: r.points, ts: new Date(Date.now() + 324e5).toISOString().slice(0, 19).replace("T", " ") }, ...me.roulette.recent].slice(0, 10);
  hit.setAttribute("d", wedge(r.index)); hit.classList.add("on");
  $$(`#disc [data-i="${r.index}"]`).forEach((e) => e.classList.add("win")); disc.classList.add("done");
  busy = false;
  readout(kind, r.points); winners(); cta();
  haptic("notificationOccurred", r.points ? "success" : "warning");
  if (r.points && tab === "roulette") celebrate(kind === "top");
  delete R.dataset.spinning;
  api("/api/me").then((m) => {
    if (busy) return;
    const same = String(m.roulette.slots) === String(me.roulette.slots);
    me = m;
    if (!same) buildWheel();
    if (tab === "home") home(); else if (tab === "roulette") { winners(); cta(); }
  }).catch(() => {});
}

function fail(el, e, again) {
  el.innerHTML = `<div class="panel empty">${icon(e.status ? "lock" : "offline")}<p></p><button class="ghost">${icon("refresh")}다시 시도</button></div>`;
  $("p", el).textContent = e.message;
  $("button", el).onclick = again;
}

function gate(e) {
  const g = $("#gate"), retry = !e.status || e.status >= 500;
  g.innerHTML = `<div class="g-em">${icon(e.status ? "lock" : "offline")}</div><h1>${!e.status ? "연결할 수 없습니다" : e.status === 401 ? "텔레그램 전용" : e.status === 403 ? "회원 전용" : "일시적인 오류"}</h1><p></p>` + (retry ? `<button class="ghost">${icon("refresh")}다시 시도</button>` : "");
  $("p", g).textContent = e.message;
  if (retry) $("button", g).onclick = () => { g.hidden = true; $("#boot").hidden = false; init(); };
  $("#boot").hidden = true; g.hidden = false;
  R.dataset.ready = "1";
}

const draw = { home, stats: drawStats, rank: drawRank, roulette: () => { if (!busy) { readout("idle"); rest(); } winners(); cta(); } };

function show(t) {
  if (t === tab) return scrollTo({ top: 0, behavior: still ? "auto" : "smooth" });
  tab = t;
  $$(".view").forEach((v) => v.classList.toggle("on", v.id === "v-" + t));
  $$("#tabs button").forEach((b, i) => { const on = b.dataset.tab === t; b.classList.toggle("on", on); on ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"); if (on) $("#tabs").style.setProperty("--k", i); });
  scrollTo(0, 0);
  enter($("#v-" + t));
  draw[t]();
}

async function init() {
  try { me = await api("/api/me"); } catch (e) { return gate(e); }
  const nav = $("#tabs"), tabs = [["home", "내 정보"], ["stats", "통계"], ["rank", "랭킹"]], u = me.user, url = tg?.initDataUnsafe?.user?.photo_url, ava = $("#c-ava");
  period = PERIOD[me.period] ? me.period : "week";
  D.title = me.app_name || D.title;
  ava.textContent = mono(u.name);
  if (/^https:\/\//.test(url || "")) { const img = new Image(); img.alt = ""; img.referrerPolicy = "no-referrer"; img.onload = () => ava.replaceChildren(img); img.src = url; }
  $("#guil").innerHTML = [30, 58].map((ry) => Array.from({ length: 36 }, (_, k) => `<ellipse rx="96" ry="${ry}" transform="rotate(${k * 5})"/>`).join("")).join("");
  if (hasWheel()) {
    tabs.push(["roulette", "룰렛"]);
    $("#app").insertAdjacentHTML("beforeend", `<section class="view" id="v-roulette"><header class="top"><h1>룰렛</h1><p>최고 ${fmt(Math.max(...me.roulette.slots))} P</p></header><div class="wheel-box noir"><div class="wheel" id="wheel"></div></div><div class="ro" id="ro" aria-live="polite"></div><button class="cta" id="spin"></button><div class="panel list" id="w-recent"></div></section>`);
    buildWheel();
    $("#spin").onclick = spin;
  }
  nav.innerHTML = `<i class="ind"></i>` + tabs.map(([k, l]) => `<button data-tab="${k}">${icon(k)}<span>${l}</span></button>`).join("");
  nav.style.setProperty("--n", tabs.length);
  $("#boot").hidden = true; $("#app").hidden = nav.hidden = false;
  show("home");
  R.dataset.ready = "1";
}

$("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.tab !== tab) haptic("selectionChanged"); show(b.dataset.tab); };
$("#h-strip").onclick = (e) => { const b = e.target.closest("[data-go]"); if (b && $(`#tabs [data-tab="${b.dataset.go}"]`)) { haptic("selectionChanged"); show(b.dataset.go); } };
$("#r-seg").onclick = (e) => { const b = e.target.closest("button"); if (b && b.dataset.period !== period) { haptic("selectionChanged"); drawRank(b.dataset.period); } };
addEventListener("resize", () => { if (innerWidth === width) return; width = innerWidth; if (tab && tab !== "roulette") draw[tab](); });
D.fonts?.ready.then(refit);
tg?.onEvent?.("themeChanged", theme);
tg?.ready?.(); tg?.expand?.();
theme();
init();
})();
</script>
