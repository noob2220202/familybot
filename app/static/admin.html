<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>관리자</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("fb-theme")||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark")}catch(e){}</script>
<link rel="stylesheet" href="/fonts/pretendard.css">
<style>
:root{color-scheme:dark;--bg:#0D0C0A;--bar:#110F0D;--surface:#151310;--elev:#1E1B16;--input:#100E0C;--line:rgba(238,226,198,.09);--line2:rgba(238,226,198,.18);--text:#F3EDE0;--text2:#ABA291;--text3:#8A8272;--gold:#C9A96A;--gold-ink:#D8BD84;--wash:rgba(201,169,106,.1);--edge:rgba(201,169,106,.36);--pos:#93C6A4;--neg:#E3927F;--neg-edge:rgba(227,146,127,.45);--neg-wash:rgba(227,146,127,.1);--panel:linear-gradient(180deg,rgba(255,240,205,.035),rgba(255,240,205,0) 48%) var(--surface);--sh:inset 0 1px 0 rgba(255,240,205,.05),0 1px 2px rgba(0,0,0,.35);--float:0 24px 48px -20px rgba(0,0,0,.9),0 2px 10px rgba(0,0,0,.5);--foil:linear-gradient(180deg,#F5E8C4,#D8BC7E 46%,#B08E4E);--metal:linear-gradient(135deg,#F3E5BE,#D3B678 30%,#A7864A 64%,#E2CA92);--on-gold:#17120A;--p2:#BDB7AA;--p3:#B08257;--glow:rgba(201,169,106,.06);--shim:rgba(255,240,205,.06);--ease:cubic-bezier(.2,.7,.2,1)}
:root[data-theme=light]{color-scheme:light;--bg:#F2EDE3;--bar:#FBF8F2;--surface:#FBF8F2;--elev:#FFFFFF;--input:#FFFFFF;--line:rgba(52,40,18,.1);--line2:rgba(52,40,18,.2);--text:#1B1813;--text2:#655D4F;--text3:#776E61;--gold:#A07C36;--gold-ink:#7E5F1E;--wash:rgba(168,132,62,.1);--edge:rgba(168,132,62,.48);--pos:#2B7A52;--neg:#B5483A;--neg-edge:rgba(181,72,58,.45);--neg-wash:rgba(181,72,58,.07);--panel:var(--surface);--sh:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(70,52,20,.05),0 12px 24px -20px rgba(70,52,20,.28);--float:0 24px 48px -20px rgba(60,44,14,.4),0 2px 8px rgba(60,44,14,.1);--foil:linear-gradient(180deg,#A07B30,#785A1C);--p2:#8F897D;--p3:#9A6C40;--glow:rgba(255,255,255,.7);--shim:rgba(255,255,255,.75)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100vh;color:var(--text);font:500 14.5px/1.5 Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;z-index:-1;height:440px;background:radial-gradient(70% 100% at 62% 0,var(--glow),transparent 70%);pointer-events:none}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
b,i,em{font-style:normal;font-weight:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.foil{padding-right:.04em;background:var(--foil);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.defs{position:absolute;width:0;height:0}

.brand{display:flex;align-items:center;gap:9px;min-width:0;font-size:13.5px;font-weight:700;letter-spacing:.28em;white-space:nowrap}
.brand svg{flex:none;width:9px;height:11px;fill:#D3B678}
.brand span{overflow:hidden;text-overflow:ellipsis}
.brand em{flex:none;padding:2px 7px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line2);font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--text3)}

input,textarea{width:100%;height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--input);outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--edge);box-shadow:0 0 0 3px var(--wash)}
input::placeholder,textarea::placeholder{color:var(--text3)}
textarea{display:block;height:auto;min-height:240px;padding:14px;line-height:1.65;resize:vertical}
.fld{display:block}
.fld>span{display:block;margin-bottom:7px;font-size:12.5px;font-weight:600;color:var(--text2)}
.inp{position:relative}
.inp input{padding-right:44px}
.inp em{position:absolute;top:50%;right:14px;font-size:13px;font-weight:600;color:var(--text3);transform:translateY(-50%);pointer-events:none}
.inp>.ic{position:absolute;top:50%;left:14px;color:var(--text3);transform:translateY(-50%);pointer-events:none}
.inp>.ic+input{padding-left:42px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap;transition:transform .15s,background-color .2s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn.gold{background:linear-gradient(#F2E3BA,#D5B97E 52%,#BE9D60);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.2),0 10px 22px -12px rgba(201,169,106,.65);color:var(--on-gold)}
.btn.line{box-shadow:inset 0 0 0 1px var(--line2)}
.btn.line:not(:disabled):hover{background:var(--wash);box-shadow:inset 0 0 0 1px var(--edge)}
.btn.danger{box-shadow:inset 0 0 0 1px var(--neg-edge);color:var(--neg)}
.btn.danger:not(:disabled):hover{background:var(--neg-wash)}
.btn.danger.solid{background:var(--neg);box-shadow:none;color:#170906}
.btn.sm{height:36px;padding:0 14px;border-radius:10px;font-size:13px}
.btn .ic{width:16px;height:16px}
.ib{display:grid;flex:none;place-items:center;width:38px;height:38px;border-radius:11px;color:var(--text2);transition:background-color .2s,color .2s}
.ib:hover{background:var(--wash);color:var(--text)}
.ib.del:hover{background:var(--neg-wash);color:var(--neg)}

.login{display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.lcard{width:min(400px,100%);padding:34px 30px 30px;border:1px solid var(--line);border-radius:26px;background:var(--panel);box-shadow:var(--sh),var(--float)}
.lcard .brand{margin-bottom:34px}
.lcard h1{font-size:24px}
.lcard>p{margin:6px 0 26px;font-size:13.5px;color:var(--text2)}
.lcard .fld+.fld{margin-top:14px}
.err{min-height:20px;margin:14px 0 6px;font-size:13px;font-weight:600;color:var(--neg)}
.lcard .btn{width:100%;height:50px;font-size:15px}

.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;display:flex;flex-direction:column;height:100vh;padding:26px 16px 18px;border-right:1px solid var(--line);background:var(--bar)}
.side .brand{padding:0 10px 30px}
#nav{display:flex;flex-direction:column;gap:3px}
#nav button{display:flex;align-items:center;gap:12px;height:44px;padding:0 13px;border-radius:12px;font-size:14px;font-weight:600;color:var(--text2);text-align:left;transition:background-color .2s,color .2s,box-shadow .2s}
#nav button:hover{background:var(--wash);color:var(--text)}
#nav .on{background:var(--elev);box-shadow:inset 0 0 0 1px var(--edge);color:var(--text)}
#nav .on .ic{color:var(--gold-ink)}
#nav .ic{width:20px;height:20px}
.foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding:14px 4px 0;border-top:1px solid var(--line)}
.foot .btn{flex:1}
.mtop{display:none}
main{width:100%;max-width:1240px;min-width:0;padding:32px 40px 120px}
.view{display:none}
.view.on{display:block;animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:22px}
h1{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.03em}
.vh p{font-size:13.5px;color:var(--text2)}
h2{font-size:15px;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
h2 small{margin-left:7px;font-size:12.5px;font-weight:500;letter-spacing:0;color:var(--text3)}
.panel{border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--sh)}
.pad{padding:20px 22px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:24px}
.ph>span{font-size:12.5px;color:var(--text2);white-space:nowrap}
.ph>span b{font-weight:600;color:var(--text)}
.muted{color:var(--text3)}
.pos{color:var(--pos)}
.neg{color:var(--neg)}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:16px}
.kpi{min-width:0;padding:18px 20px 17px}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi .lab{font-size:12.5px;color:var(--text2)}
.kpi .val{margin-top:6px;overflow:hidden;font-size:25px;line-height:1.2;font-weight:600;letter-spacing:-.025em;white-space:nowrap;text-overflow:ellipsis}
.kpi .val i{margin-left:.14em;font-size:.56em;font-weight:500;letter-spacing:0;color:var(--text2)}
.kpi .sub{margin-top:4px;overflow:hidden;font-size:12px;color:var(--text3);white-space:nowrap;text-overflow:ellipsis}
.dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start;gap:16px}
.dash .rk{grid-column:2;grid-row:1/span 3}

.chart{position:relative;margin-top:14px}
.chart svg{display:block;overflow:visible}
.gl{stroke:var(--line)}
.gl.b{stroke:var(--line2)}
.avl{stroke:var(--text3);stroke-dasharray:2 3}
.key{display:inline-block;width:12px;margin-right:6px;border-top:1.5px dashed var(--text3);vertical-align:middle}
.tk{font-size:11px;fill:var(--text3)}
.pk{font-size:11px;font-weight:600;fill:var(--text2);stroke:var(--surface);stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
.nil{font-size:12.5px;fill:var(--text3)}
.bars path{fill:url(#gBar);transform-box:fill-box;transform-origin:50% 100%;transition:opacity .15s;animation:grow .8s var(--ease) both;animation-delay:calc(var(--d)*12ms)}
@keyframes grow{from{transform:scaleY(0)}}
.xh{stroke:var(--line2);opacity:0}
.hov .xh{opacity:1}
.hov .pk{opacity:0}
.hov .bars path{opacity:.34}
.hov .bars path.on{opacity:1}
.tip{position:absolute;top:-8px;left:0;display:flex;align-items:baseline;gap:7px;padding:6px 10px;border-radius:10px;background:var(--elev);box-shadow:inset 0 0 0 1px var(--line2),var(--float);font-size:12px;color:var(--text2);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.tip b{font-size:13px;font-weight:600;color:var(--text)}
.hov .tip{opacity:1}

.rl{margin-top:10px}
.rr{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:6px 8px;margin:0 -8px;border-radius:12px;text-align:left;transition:background-color .15s}
button.rr:hover{background:var(--wash)}
.rr+.rr{box-shadow:0 -1px 0 var(--line)}
.rn{flex:none;width:24px;font-size:13.5px;font-weight:600;color:var(--text3);text-align:center}
.av{display:grid;flex:none;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--elev);box-shadow:inset 0 0 0 1px var(--line2);font-size:13.5px;font-weight:600;line-height:1;color:var(--text2)}
.m1 .av{border:1.5px solid transparent;background:linear-gradient(var(--elev),var(--elev)) padding-box,var(--metal) border-box;box-shadow:none;color:var(--gold-ink)}
.m2 .av{box-shadow:inset 0 0 0 1.5px var(--p2);color:var(--text)}
.m3 .av{box-shadow:inset 0 0 0 1.5px var(--p3);color:var(--text)}
.m1 .rn{color:var(--gold-ink)}
.rr b{flex:1;min-width:0;overflow:hidden;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.rr em{flex:none;font-weight:600;color:var(--text2)}
.m1 em{color:var(--gold-ink)}

.tool{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.tool .inp{flex:1;min-width:240px}
.seg{position:relative;display:inline-grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;padding:4px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap;transition:background-color .2s,color .2s,box-shadow .2s}
.seg button:hover{color:var(--text)}
.seg .on{background:var(--elev);box-shadow:inset 0 0 0 1px var(--edge),0 2px 6px -2px rgba(0,0,0,.35);color:var(--text)}

.tbl{overflow:hidden}
.thead,.trow{display:grid;grid-template-columns:var(--cols);align-items:center;gap:14px;padding:0 22px}
.thead{height:44px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text3)}
.trow{width:100%;min-height:62px;padding-top:9px;padding-bottom:9px;border-bottom:1px solid var(--line);text-align:left}
.trow:last-child{border-bottom:0}
button.trow{transition:background-color .15s}
button.trow:hover{background:var(--wash)}
.n{text-align:right;white-space:nowrap}
.n b{font-weight:600}
.sh{display:none}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who>span{min-width:0}
.who b,.who small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.who b{font-weight:600}
.who small{font-size:12px;color:var(--text3)}
.u{--cols:minmax(0,2.6fr) repeat(4,minmax(0,1fr)) minmax(96px,1fr)}
.l{--cols:112px minmax(0,1.6fr) 72px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
.l .trow{min-height:54px}
.c-meta{display:none}
.tag{display:inline-block;height:22px;padding:0 8px;border-radius:7px;background:var(--elev);box-shadow:inset 0 0 0 1px var(--line2);font-size:11.5px;font-weight:600;line-height:22px;color:var(--text2)}
.tag.points{background:var(--wash);box-shadow:inset 0 0 0 1px var(--edge);color:var(--gold-ink)}
.cut{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:14px}
.pager span{margin-right:6px;font-size:13px;color:var(--text2)}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:48px 20px;color:var(--text3);text-align:center}
.empty .ic{width:28px;height:28px;margin-bottom:10px;stroke-width:1.25}
.empty p{font-size:14.5px;font-weight:600;color:var(--text2)}
.empty span{font-size:13px}
.empty .btn{margin-top:14px}

.sec{margin-bottom:16px}
.sec>.ph{margin-bottom:4px}
.sec .desc{font-size:13px;color:var(--text3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
.sw{display:inline-flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;font-weight:600}
.sw input{flex:none;appearance:none;-webkit-appearance:none;width:48px;height:28px;padding:0;border:0;border-radius:14px;background:var(--line2);box-shadow:none;cursor:pointer;transition:background .25s}
.sw input::before{content:"";display:block;width:22px;height:22px;margin:3px;border-radius:50%;background:#F3EDE0;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .25s var(--ease)}
.sw input:checked{background:linear-gradient(#EAD8A7,#C3A267)}
.sw input:checked::before{background:#17120A;transform:translateX(20px)}
.sw input:focus{box-shadow:0 0 0 3px var(--wash)}
.slots{margin-top:18px}
.sl-h,.slot{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,.8fr) minmax(0,1.3fr) 38px;align-items:center;gap:12px}
.sl-h{padding-bottom:8px;font-size:12px;font-weight:600;color:var(--text3)}
.slot{padding:6px 0}
.slot .no{font-size:13px;font-weight:600;color:var(--text3);text-align:center}
.prob{display:flex;align-items:center;gap:10px}
.prob i{flex:1;height:6px;overflow:hidden;border-radius:3px;background:var(--line)}
.prob i::before{content:"";display:block;width:var(--w);height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-ink));transition:width .3s var(--ease)}
.prob b{flex:none;width:52px;font-size:13px;font-weight:600;text-align:right}
.acts{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.acts span{font-size:13px;color:var(--text2)}
.acts span b{font-weight:600;color:var(--text)}
.off .slots,.off .acts{opacity:.45}
.lg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.lgc{padding:16px 16px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.lgc h3{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;font-size:14px;font-weight:600}
.lgc h3 small{font-size:12px;font-weight:500;color:var(--text3)}
.lgr{display:grid;grid-template-columns:88px minmax(0,1fr) 38px;gap:8px;padding:4px 0}
.lgr input{height:38px;padding:0 11px;border-radius:10px;font-size:13.5px}
.lgc .none{padding:10px 0 14px;font-size:13px;color:var(--text3)}
.find{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.find form{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.find .inp{flex:1;min-width:200px}
.res{margin-top:12px}
.res .rr{cursor:default}
.res .rr small{margin-left:8px;font-size:12px;color:var(--text3)}
.res .rr>span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.res .id{flex:none;width:64px;font-size:12.5px;color:var(--text3)}
.danger-zone{border-color:var(--neg-edge)}
.danger-zone .acts{justify-content:flex-start}
.save{position:fixed;right:0;bottom:0;left:240px;z-index:25;display:flex;justify-content:center;padding:0 24px 22px;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(40px);transition:transform .45s var(--ease),opacity .3s,visibility .45s}
.save.on{opacity:1;visibility:visible;transform:none}
.save>div{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 20px;border-radius:16px;background:var(--elev);box-shadow:inset 0 0 0 1px var(--edge),var(--float);pointer-events:auto}
.save p{margin-right:8px;font-size:13.5px;font-weight:600;white-space:nowrap}

.compose{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.tb{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 10px}
.tb button{min-width:38px;height:34px;padding:0 10px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;font-weight:600;color:var(--text2);transition:background-color .2s,color .2s}
.tb button:hover{background:var(--wash);color:var(--text)}
.tb .bi{font-weight:800}
.tb .it{font-style:italic}
.tb .un{text-decoration:underline}
.cnt{margin-top:8px;font-size:12px;color:var(--text3);text-align:right}
.send{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:18px}
.bubble{max-width:420px;margin-top:14px;padding:12px 14px 9px;border-radius:16px 16px 16px 6px;background:var(--elev);box-shadow:inset 0 0 0 1px var(--line2);font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.bubble b,.bubble strong{font-weight:700}
.bubble i,.bubble em{font-style:italic}
.bubble u{text-decoration:underline}
.bubble a{color:var(--gold-ink)}
.bubble blockquote{margin:4px 0;padding:2px 0 2px 10px;border-left:3px solid var(--gold);border-radius:2px}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.bubble time{display:block;margin-top:4px;font-size:11px;color:var(--text3);text-align:right}

dialog{width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 32px);margin:auto;padding:0;border:1px solid var(--line2);border-radius:22px;background:var(--elev);color:var(--text);box-shadow:var(--float)}
dialog[open]{animation:pop .3s var(--ease)}
dialog::backdrop{background:rgba(8,7,5,.6)}
.dlg{padding:22px}
.dh{display:flex;align-items:center;gap:14px}
.dh>div{flex:1;min-width:0}
.dh h3{overflow:hidden;font-size:18px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;text-overflow:ellipsis}

.bal2>div{min-width:0;padding:12px 16px}

.chips button:hover{box-shadow:inset 0 0 0 1px var(--edge);color:var(--text)}
.pv{min-height:42px;margin-top:14px;padding:11px 14px;border-radius:12px;background:var(--surface);font-size:13px;color:var(--text2)}

.df{display:flex;gap:10px;margin-top:20px}
.df .btn{flex:1}
.cf p{margin-top:8px;font-size:14px;line-height:1.6;color:var(--text2);word-break:keep-all}
.cf h3{font-size:18px;font-weight:700;letter-spacing:-.02em}

.toast{position:fixed;bottom:26px;left:50%;z-index:100;max-width:min(560px,calc(100vw - 32px));padding:12px 18px;border-radius:14px;background:var(--elev);box-shadow:inset 0 0 0 1px var(--edge),var(--float);font-size:13.5px;font-weight:600;opacity:0;transform:translate(-50%,14px);pointer-events:none;transition:opacity .25s,transform .4s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{box-shadow:inset 0 0 0 1px var(--neg-edge),var(--float);color:var(--neg)}

.sk{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--shim) 50%,transparent 70%);transform:translateX(-100%);animation:shim 1.5s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.sks{display:grid;gap:16px}

function bar(i, x, y0, h, w) {
  const r = Math.min(3, w / 2, h);
  return `<path style="--d:${i}" data-i="${i}" d="M${f1(x - w / 2)} ${y0}V${f1(y0 - h + r)}q0 ${-r} ${r} ${-r}h${f1(w - 2 * r)}q${r} 0 ${r} ${r}V${y0}Z"/>`;
}

function chart(el, o) {
  const v = o.v, n = v.length, W = el.clientWidth, H = o.h, pt = 22, pb = 22, pw = W - 38, ph = H - pt - pb, y0 = pt + ph;
  const max = Math.max(0, ...v), top = nice(max), sw = pw / (n || 1), bw = Math.max(2, Math.min(o.bw, sw * .64));
  const X = (i) => f1((i + .5) * sw), Y = (x) => f1(y0 - (top ? x / top * ph : 0));
  let s = `<line class="gl b" x2="${pw}" y1="${y0}" y2="${y0}"/>`;
  if (max) {
    const pk = v.indexOf(max);
    [1, .5].forEach((k) => { const y = Y(top * k); s += `<line class="gl" x2="${pw}" y1="${y}" y2="${y}"/><text class="tk" x="${W}" y="${y + 4}" text-anchor="end">${kfmt(top * k)}</text>`; });
    if (o.avg) s += `<line class="avl" x2="${pw}" y1="${Y(v.reduce((a, b) => a + b, 0) / n)}" y2="${Y(v.reduce((a, b) => a + b, 0) / n)}"/>`;
    s += `<g class="bars">${v.map((x, i) => (x ? bar(i, X(i), y0, Math.max(2, x / top * ph), bw) : "")).join("")}</g>`;
    s += `<text class="pk" x="${clamp(X(pk), 18, pw - 18)}" y="${Y(max) - 8}" text-anchor="middle">${o.peak(pk)}</text>`;
  } else s += `<text class="nil" x="${pw / 2}" y="${pt + ph / 2 + 4}" text-anchor="middle">기록 없음</text>`;
  o.ticks.forEach(([i, t]) => { s += `<text class="tk" x="${!i ? 0 : i === n - 1 ? pw : X(i)}" y="${H - 4}" text-anchor="${!i ? "start" : i === n - 1 ? "end" : "middle"}">${t}</text>`; });
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.name}">${s}<line class="xh" y1="${pt - 4}" y2="${y0}"/></svg><div class="tip"><span></span><b></b></div>`;
  if (!n) return;
  const svg = $("svg", el), xh = $(".xh", el), tip = $(".tip", el), marks = $$(".bars path", el);
  const at = (e) => {
    const i = clamp(Math.floor(((e.touches ? e.touches[0] : e).clientX - svg.getBoundingClientRect().left) / sw), 0, n - 1);
    el.classList.add("hov");
    marks.forEach((b) => b.classList.toggle("on", +b.dataset.i === i));
    xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i));
    [tip.firstChild.textContent, tip.lastChild.textContent] = o.tip(i);
    tip.style.transform = `translateX(${clamp(X(i) - tip.offsetWidth / 2, 0, W - tip.offsetWidth)}px)`;
  };
  ["mousemove", "touchstart", "touchmove"].forEach((k) => svg.addEventListener(k, at, { passive: true }));
  ["mouseleave", "touchend", "touchcancel"].forEach((k) => svg.addEventListener(k, () => el.classList.remove("hov")));
}

function charts() {
  if (!dash) return;
  const d = dash.daily, h = dash.hourly, n = d.length, c = $$("#d-body .chart");
  if (c.length < 3) return;
  const wk = Array.from({ length: Math.ceil(n / 7) }, (_, i) => n - 1 - i * 7).map((i) => [i, i === n - 1 ? "오늘" : md(d[i].day)]);
  const daily = (name, k, un) => ({ name, v: d.map((x) => x[k]), h: 190, bw: 14, avg: 1, peak: (i) => fmt(d[i][k]), ticks: wk, tip: (i) => [md(d[i].day), fmt(d[i][k]) + un] });
  chart(c[0], daily("일별 채팅", "messages", "회"));
  chart(c[1], daily("일별 활동 인원", "users", "명"));
  chart(c[2], { name: "시간대별 채팅", v: h, h: 170, bw: 16, peak: (i) => `${i}시`, ticks: [0, 6, 12, 18, 23].map((i) => [i, `${i}시`]), tip: (i) => [`${i}시`, fmt(h[i]) + "회"] });
}

function pager(p, page, r) {
  const total = r.total, size = r.page_size, last = Math.max(0, Math.ceil(total / size) - 1);
  $(`#${p}-info`).textContent = `${fmt(total)}${p === "u" ? "명" : "건"}`;
  $(`#${p}-page`).textContent = total ? `${fmt(page * size + 1)}–${fmt(Math.min(total, (page + 1) * size))} / ${fmt(total)}` : "";
  $(`#${p}-prev`).disabled = page <= 0;
  $(`#${p}-next`).disabled = page >= last;
}

function amount() {
  const v = parseInt(($("#a-amt").value || "").replace(/[^\d]/g, ""), 10);
  return v > 0 && v <= 1e12 ? v : 0;
}

function adjView() {
  const have = cur[kind], un = UNIT[kind], a = amount();
  $("#a-pts").textContent = big(cur.points) + " P"; $("#a-tix").textContent = big(cur.tickets) + "장";
  $("#a-pts").title = fmt(cur.points) + " P"; $("#a-tix").title = fmt(cur.tickets) + "장";
  $("#a-unit").textContent = un.trim();
  $$("#a-kind button").forEach((b) => b.classList.toggle("on", b.dataset.k === kind));
  $("#a-chips").innerHTML = (kind === "points" ? [100, 1000, 10000, 100000] : [1, 5, 10]).map((x) => `<button type="button" data-add="${x}">+${fmt(x)}</button>`).join("");
  $("#a-pv").innerHTML = a ? `지급 후 <b>${fmt(have + a)}${un}</b> · 회수 후 <b>${fmt(Math.max(0, have - a))}${un}</b>` : "수량을 입력하세요.";
  $("#a-give").disabled = $("#a-take").disabled = !a;
  $("#a-take").disabled ||= !have;
}

function openUser(u) {
  cur = { ...u }; kind = "points";
  $("#a-av").textContent = mono(u.name);
  $("#a-name").textContent = u.name;
  $("#a-meta").textContent = `${u.username ? "@" + u.username + " · " : ""}ID ${u.user_id}`;
  $("#a-amt").value = "";
  adjView();
  $("#adj").showModal();
  $("#a-amt").focus();
}

const findUser = safe(async (id) => {
  const r = await api(`/api/users?q=${id}`), u = r.rows.find((x) => x.user_id === id);
  if (u) openUser(u); else toast("회원을 찾을 수 없습니다.", 1);
});

const adjust = safe(async (sign) => {
  const a = amount();
  if (!a) return;
  $("#a-give").disabled = $("#a-take").disabled = true;
  try {
    const r = await api(`/api/users/${cur.user_id}/adjust`, "POST", { kind, delta: sign * a }), un = UNIT[kind];
    cur[kind] = r.balance;
    $("#adj").close();
    toast(r.applied ? `${KIND[kind]} ${r.applied > 0 ? "+" : "−"}${fmt(Math.abs(r.applied))}${un} · 잔액 ${fmt(r.balance)}${un}` : "회수할 수량이 없습니다.");
    if (view === "users") load.users(); else if (view === "dashboard") load.dashboard();
  } finally { adjView(); }
});

const save = safe(async () => {
  const c = cfg;
  if (!c.app_name.trim()) return toast("브랜드 이름을 입력하세요.", 1);
  if (!c.roulette_slots.reduce((a, x) => a + x.weight, 0)) return toast("룰렛 가중치의 합이 0입니다.", 1);
  if (Object.values(c.leagues).some((l) => l.some((x) => !String(x.name).trim()))) return toast("리그 이름을 입력하세요.", 1);
  $("#s-save").disabled = true;
  try { cfg = await api("/api/settings", "PUT", c); saved = JSON.stringify(cfg); }
  finally { $("#s-save").disabled = false; }
  brand(); settings(); dash = null; toast("저장했습니다.");
});

const reset = safe(async (k) => {
  const label = { points: "전체 포인트 초기화", tickets: "전체 이용권 초기화", chat: "채팅 횟수 초기화" }[k];
  const body = { points: "모든 회원의 포인트가 0이 됩니다.", tickets: "모든 회원의 이용권이 0장이 됩니다.", chat: "랭킹과 통계의 채팅 기록이 모두 삭제됩니다." }[k];
  if (!(await ask(label, body + " 되돌릴 수 없습니다.", "초기화", true))) return;
  const r = await api("/api/reset/" + k, "POST");
  dash = null; pages.users = pages.logs = null;
  toast(`${label} 완료 · ${fmt(r.affected)}명`);
});

function tgHtml(src) {
  return esc(src)
    .replace(/&#60;(\/?)(b|strong|i|em|u|ins|s|strike|del|code|pre|blockquote|tg-spoiler)&#62;/g, "<$1$2>")
    .replace(/&#60;blockquote expandable&#62;/g, "<blockquote>")
    .replace(/&#60;a href=&#34;(https?:\/\/[^\s<>]*?)&#34;&#62;/g, '<a href="$1" target="_blank" rel="noopener noreferrer">')
    .replace(/&#60;\/a&#62;/g, "</a>");
}

function preview() {
  const t = $("#nt").value, n = [...t].length, now = new Date();
  $("#nc").textContent = `${fmt(n)} / 4,000`;
  $("#ns").disabled = !t.trim();
  $("#nv").innerHTML = `<b>📢 공지</b>\n\n${t.trim() ? tgHtml(t) : `<span class="muted">내용을 입력하면 여기에 표시됩니다.</span>`}<time>${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}</time>`;
}

function wrap(tag) {
  const ta = $("#nt"), a = ta.selectionStart, b = ta.selectionEnd, sel = ta.value.slice(a, b);
  const open = tag === "a" ? '<a href="https://">' : `<${tag}>`, close = `</${tag}>`;
  ta.setRangeText(open + sel + close, a, b, "end");
  if (tag === "a") ta.setSelectionRange(a + 9, a + 17); else if (!sel) ta.setSelectionRange(a + open.length, a + open.length);
  ta.focus(); preview();
}

const send = safe(async () => {
  const text = $("#nt").value.trim(), pin = $("#np").checked;
  if (!text) return;
  if (!(await ask("공지 보내기", `그룹방에 공지를 보냅니다${pin ? " (상단 고정)" : ""}.`, "보내기"))) return;
  $("#ns").disabled = true;
  try { await api("/api/notice", "POST", { text, pin }); }
  catch (e) {
    if (e.status !== 502) throw e;
    $("#nt").value = ""; preview();
    return toast(e.message, 1);
  } finally { preview(); }
  $("#nt").value = ""; $("#np").checked = false; preview();
  toast("그룹방에 보냈습니다.");
});

$("#nav").innerHTML = VIEWS.map(([k, v]) => `<button type="button" data-view="${k}">${icon(k)}<span>${v}</span></button>`).join("");
$("#nav").onclick = (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.view); };
$$(".lo").forEach((b) => { if (!b.textContent) b.innerHTML = icon("logout"); b.onclick = safe(async () => { await api("/api/logout", "POST"); cfg = null; saved = ""; dash = null; login("로그아웃했습니다."); }); });
$$(".th").forEach((b) => (b.onclick = () => theme(R.dataset.theme === "dark" ? "light" : "dark")));
theme(R.dataset.theme === "light" ? "light" : "dark");

$("#lf").onsubmit = async (e) => {
  e.preventDefault();
  const u = $("#lu").value.trim(), p = $("#lp").value, b = $("#lb");
  if (!u || !p) { $("#le").textContent = "아이디와 비밀번호를 입력하세요."; return (u ? $("#lp") : $("#lu")).focus(); }
  b.disabled = true;
  try { await api("/api/login", "POST", { username: u, password: p }); $("#le").textContent = ""; enter(); }
  catch (err) { $("#le").textContent = err.message; $("#lp").select(); }
  finally { b.disabled = false; }
};

$("#d-body").onclick = (e) => { const b = e.target.closest("[data-uid]"); if (b) findUser(+b.dataset.uid); };
let tq;
$("#uq").oninput = () => { clearTimeout(tq); tq = setTimeout(() => { uq = $("#uq").value.trim(); up = 0; load.users(); }, 250); };
$("#uq").onkeydown = (e) => { if (e.key === "Enter") { clearTimeout(tq); uq = $("#uq").value.trim(); up = 0; load.users(); } };
$("#us").onclick = (e) => { const b = e.target.closest("button"); if (!b || b.dataset.sort === us) return; us = b.dataset.sort; up = 0; $$("#us button").forEach((x) => x.classList.toggle("on", x === b)); load.users(); };
$("#u-prev").onclick = () => { up--; load.users(); };
$("#u-next").onclick = () => { up++; load.users(); };
$("#u-list").onclick = (e) => { const b = e.target.closest("[data-uid]"); if (b) openUser(pages.users.rows.find((u) => u.user_id === +b.dataset.uid)); };
let tl;
$("#lq").oninput = () => { clearTimeout(tl); tl = setTimeout(() => { lq = $("#lq").value.trim(); lp = 0; load.logs(); }, 250); };
$("#lq").onkeydown = (e) => { if (e.key === "Enter") { clearTimeout(tl); lq = $("#lq").value.trim(); lp = 0; load.logs(); } };
$("#l-prev").onclick = () => { lp--; load.logs(); };
$("#l-next").onclick = () => { lp++; load.logs(); };

$("#adj").onclick = (e) => {
  if (e.target === $("#adj") || e.target.closest("[data-close]")) return $("#adj").close();
  const k = e.target.closest("[data-k]"), add = e.target.closest("[data-add]");
  if (k) { kind = k.dataset.k; adjView(); $("#a-amt").focus(); }
  if (add) { $("#a-amt").value = fmt(amount() + +add.dataset.add); adjView(); }
};
$("#a-amt").oninput = () => { const a = amount(); if (a) $("#a-amt").value = fmt(a); adjView(); };
$("#a-give").onclick = () => adjust(1);
$("#a-take").onclick = () => adjust(-1);
$("#cf").onclick = (e) => { if (e.target === $("#cf")) $("#cf").close(); };

const S = $("#v-settings");
S.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.k) cfg[t.dataset.k] = "num" in t.dataset ? parseInt(t.value.replace(/[^\d]/g, ""), 10) || 0 : t.value;
  if (t.dataset.slot) { cfg.roulette_slots[t.dataset.slot][t.dataset.f] = parseInt(t.value.replace(/[^\d]/g, ""), 10) || 0; probs(); }
  if (t.dataset.lg) { const l = cfg.leagues[t.dataset.lg][t.dataset.i]; l[t.dataset.f] = t.dataset.f === "id" ? parseInt(t.value.replace(/[^\d]/g, ""), 10) || 0 : t.value; }
  if (t.id === "s-on") { cfg.roulette_enabled = t.checked; $("#s-rl").classList.toggle("off", !t.checked); $("#s-onl").textContent = t.checked ? "사용" : "사용 안 함"; }
  mark();
});
S.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.period) { cfg.ranking_period = t.dataset.period; $$("#s-period button").forEach((b) => b.classList.toggle("on", b === t)); }
  else if (t.id === "slot-add") { cfg.roulette_slots.push({ points: 0, weight: 1 }); slots(); }
  else if (t.dataset.delSlot) { cfg.roulette_slots.splice(+t.dataset.delSlot, 1); slots(); }
  else if (t.dataset.delLg) { cfg.leagues[t.dataset.delLg].splice(+t.dataset.i, 1); leagues(); results(); }
  else if (t.dataset.sport) { sport = t.dataset.sport; found = []; $$("#s-sport button").forEach((b) => b.classList.toggle("on", b === t)); results(); $("#fq").focus(); }
  else if (t.dataset.pick) { const l = found[+t.dataset.pick]; (cfg.leagues[sport] ||= []).push({ id: l.id, name: l.name }); leagues(); results(); toast(`${SPORT[sport]} · ${l.name} 추가`); }
  else if (t.dataset.reset) reset(t.dataset.reset);
  mark();
});
S.addEventListener("submit", (e) => { e.preventDefault(); search(); });
$("#s-save").onclick = save;
$("#s-undo").onclick = () => { cfg = JSON.parse(saved); settings(); };

$("#nt").oninput = preview;
$("#tb").onclick = (e) => { const b = e.target.closest("[data-w]"); if (b) wrap(b.dataset.w); };
$("#ns").onclick = send;

addEventListener("beforeunload", (e) => { if (dirty()) e.preventDefault(); });
addEventListener("resize", () => { if (innerWidth === width) return; width = innerWidth; clearTimeout(tq); if (view === "dashboard") charts(); });

(async () => {
  try { (await api("/api/session")).authed ? enter() : login(); }
  catch (e) { login(e.message); }
})();
})();
</script>
